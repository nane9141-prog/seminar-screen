<script>
(()=>{
const stage=document.getElementById('stage'),S=document.getElementById('K0'),v=S.querySelector('video');
const Q=new URLSearchParams(location.search),EMB=Q.has('embed')&&parent!==window;if(EMB)document.documentElement.classList.add('embed');
const up=m=>{if(EMB)parent.postMessage(m,'*');};
function fit(){const s=Math.min(innerWidth/4200,innerHeight/1600);stage.style.transform=`translate(${(innerWidth-4200*s)/2}px,${(innerHeight-1600*s)/2}px) scale(${s})`;}
addEventListener('resize',fit);fit();

// 영상 프레임 동적 마스킹 (canvas, 4조각 · 조각마다 속도 다르게) — t = 시퀀스 시작 후 초
const cv=S.querySelector('.qv canvas'),cx=cv.getContext('2d'),W=1372,H=1600;let t0=0,raf=0;
const cl=x=>Math.max(0,Math.min(1,x)),oc=x=>1-Math.pow(1-cl(x),3),io=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};
const IN=[[0,.95,-1,.55],[.12,1.35,1,.9],[.05,.8,-1,.35],[.2,1.15,1,.75]],   // 등장: 지연 · 길이 · 방향 · 거리(화면 높이 비)
      MV=[[0,.9],[.08,1.15],[.03,.75],[.14,1.05]],                       // 이동 때 가로 조각: 지연 · 길이
      OUT=[[0,.55,-1],[.1,.8,1],[.04,.45,1],[.16,.7,-1]];                 // 퇴장: 지연 · 길이 · 방향
function draw(){raf=requestAnimationFrame(draw);const t=(performance.now()-t0)/1000;cx.clearRect(0,0,W,H);
 if(t<3.4||t>20.5||v.readyState<2)return;
 const vw=v.videoWidth||720,vh=v.videoHeight||840,kx=vw/W,ky=vh/H,N=4;
 if(t<5.2){const cw=W/N;  // 등장: 세로 4조각이 위 · 아래에서 각자 다른 속도로 들어와 맞물림
  for(let i=0;i<N;i++){const[d,du,dir,dist]=IN[i],p=oc((t-3.5-d)/du);if(p<=0)continue;const dy=(1-p)*dir*dist*H,x=Math.round(i*cw),w=Math.round((i+1)*cw)-x;
   cx.globalAlpha=cl(p*1.8);cx.drawImage(v,x*kx,0,w*kx,vh,x,dy,w,H);}cx.globalAlpha=1;return;}
 const rh=H/N;let any=false,dx=[0,0,0,0],al=[1,1,1,1];
 if(t>12&&t<13.6){for(let j=0;j<N;j++){const[d,du]=MV[j],p=cl((t-12.05-d)/du);dx[j]=Math.sin(p*Math.PI)*(j%2?1:-1)*(60+j*25)*(1-p*.3);}any=true;}
 if(t>19.45){for(let j=0;j<N;j++){const[d,du,dir]=OUT[j],p=io((t-19.45-d)/du);dx[j]=dir*p*W*1.1;al[j]=1-cl(p*1.3);}any=true;}
 if(!any){cx.drawImage(v,0,0,vw,vh,0,0,W,H);return;}
 for(let j=0;j<N;j++){const y=Math.round(j*rh),h=Math.round((j+1)*rh)-y;cx.globalAlpha=al[j];cx.drawImage(v,0,y*ky,vw,h*ky,dx[j],y,W,h);}cx.globalAlpha=1;}
const BBf=S.querySelector('.bb iframe');let BBt=[];const bbp=m=>{try{BBf.contentWindow.postMessage(m,'*');}catch(e){}};
function bbPlan(){BBt.forEach(clearTimeout);BBt=[[19.5,'play'],[22.1,'pause'],[27,'play'],[29.6,'pause']].map(([t,m])=>setTimeout(()=>bbp(m),t*1000));}
function start(){t0=performance.now();bbPlan();cancelAnimationFrame(raf);raf=requestAnimationFrame(draw);S.classList.remove('cur');void S.offsetWidth;S.classList.add('cur');try{v.currentTime=0;}catch(e){}v.play().catch(()=>{});up({s4:'pos',label:''});}
function stop(){S.classList.remove('cur');v.pause();BBt.forEach(clearTimeout);bbp('pause');cancelAnimationFrame(raf);}
addEventListener('message',e=>{const d=e.data||{};if(!EMB||e.source!==parent||!d.s4)return;
 if(d.s4==='enter')start();else if(d.s4==='leave')stop();else if(d.s4==='nav')up({s4:'edge',d:d.d});});
addEventListener('keydown',e=>{if(EMB)return;if(e.key==='r'||e.key==='R'||e.key==='Home')start();
 else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});}});
document.fonts.ready.then(()=>{if(!EMB)start();up({s4:'ready'});});
})();
</script>
