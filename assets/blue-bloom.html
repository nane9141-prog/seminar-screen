<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>Blue Bloom</title>
<!-- 'Blue Bloom Gradient' 아티팩트(2026-11-23 버전)의 실크 흐름 셰이더를 그대로 옮긴 재생 전용 판.
     패널 · 효과(FX) · 녹화 제거, 아티팩트 기본값(시퀀스 35초 · 속도 2 · 색 4종 + 민트 3%) 고정.
     부모가 postMessage('play' | 'pause')로 재생을 켜고 끔. 처음엔 멈춤. 성능을 위해 낮은 해상도로 그린 뒤 늘려 씀(부드러운 그라데이션이라 차이 없음). -->
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style>
</head><body>
<canvas id="c"></canvas>
<script>
(()=>{
const cv=document.getElementById('c');
const gl=cv.getContext('webgl',{antialias:false,alpha:false});
if(!gl)return;
const vsrc=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const fsrc=`
precision highp float;
uniform vec2 R; uniform float PH;
uniform vec3 C0,C1,C2,C3,ACC;
uniform float AMT, WHITE, SCALE, WARP, CAM, SPEC, CREST, DARK, ZOOM;
#define TAU 6.2831853
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*f*(f*(f*6.-15.)+10.);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm2(vec2 p){return .62*vn(p)+.38*vn(p*1.9+vec2(3.7,1.1));}
float field(vec2 p,float ph){
  vec2 cyc=vec2(cos(ph),sin(ph));
  vec2 q=p*.45/SCALE;
  float n1=fbm2(q+cyc*.55);
  float n2=fbm2(q*1.25+vec2(n1*1.3,-n1)*WARP+cyc.yx*.45+vec2(4.1,2.3));
  vec2 pp=p/SCALE;
  float b1=.5+.5*sin((pp.x*.62+pp.y*.95)*1.25+n2*4.2*WARP+ph);
  float b2=.5+.5*sin((pp.x*-.9+pp.y*.4)*.9+n1*3.4*WARP-ph+1.3);
  return .07+WHITE-DARK*.30+.44*b1+.22*b2+.28*n2;
}
vec3 shade(float f){
  vec3 c=mix(C0,C1,smoothstep(.30,.48,f));
  c=mix(c,C2,smoothstep(.46,.58,f));
  c=mix(c,C3,smoothstep(.55,.70,f));
  c=mix(c,mix(C3,vec3(1.,.9,.97),.6),smoothstep(.80,.97,f)*.6);
  return c;
}
void main(){
  vec2 p=(gl_FragCoord.xy-.5*R)/R.y*2.;
  float ph=PH*TAU;
  p=p/(ZOOM*(1.+.10*CAM*sin(ph)))+CAM*vec2(.15*sin(ph),.08*sin(2.*ph));
  float f=field(p,ph);
  vec2 e=vec2(.018,.010)*SPEC;
  vec3 col=vec3(shade(field(p+e,ph)).r,shade(f).g,shade(field(p-e,ph)).b);
  col+=mix(C3,vec3(1.),.4)*exp(-pow((f-.60)/.018,2.))*.28*CREST;
  float band=smoothstep(.38,.50,f)*(1.-smoothstep(.56,.68,f));
  float drift=.5+.5*sin(p.x*.9-p.y*.6+ph+f*4.);
  col=mix(col,ACC*(.75+.35*f),clamp(band*(.55+.9*drift)*AMT*3.2,0.,.85));
  col*=1.-.12*dot(p*.45,p*.45);
  col=mix(col,C0*.18,DARK*.85*(1.-smoothstep(.50,.72,f)));
  gl_FragColor=vec4(clamp(col,0.,1.),1.);
}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o;}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vsrc));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fsrc));gl.bindAttribLocation(pr,0,'p');gl.linkProgram(pr);gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U={};['R','PH','C0','C1','C2','C3','ACC','AMT','WHITE','SCALE','WARP','CAM','SPEC','CREST','DARK','ZOOM'].forEach(n=>U[n]=gl.getUniformLocation(pr,n));
/* 아티팩트 기본값 */
const S={c0:'#2844cc',c1:'#1466ff',c2:'#52b8ff',c3:'#152061',acc:'#2ee6c8',amt:.03,seqlen:35,speed:2,scale:1,warp:.7,cam:.7,white:0,spec:0,crest:0};
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255);
['C0','C1','C2','C3'].forEach((n,i)=>gl.uniform3f(U[n],...hex(S['c'+i])));gl.uniform3f(U.ACC,...hex(S.acc));
gl.uniform1f(U.SCALE,S.scale);gl.uniform1f(U.CAM,S.cam);gl.uniform1f(U.SPEC,S.spec);gl.uniform1f(U.CREST,0);
/* 시퀀스: 다크 → 떠오름 → 플러드 → 컬러 → 흐름 → 잔잔 → 가라앉음 */
const BASE=20;
const KEYS=[
  {t:0.0, v:[-0.24,1.00,0.8,0.0,0.55]},
  {t:3.0, v:[-0.10,0.95,1.0,0.3,0.18]},
  {t:6.0, v:[ 0.14,0.72,1.1,0.6,0.00]},
  {t:9.0, v:[ 0.00,0.90,1.2,2.2,0.00]},
  {t:12.0,v:[ 0.06,1.15,1.5,1.0,0.00]},
  {t:15.0,v:[-0.04,1.05,0.9,0.5,0.05]},
  {t:18.0,v:[-0.20,1.00,0.8,0.1,0.42]},
];
function hermite(K,t){
  t=((t%BASE)+BASE)%BASE;const n=K.length;
  const at=j=>{const w=Math.floor(j/n),k=K[((j%n)+n)%n];return {t:k.t+w*BASE,v:k.v};};
  let i=0;for(let j=0;j<n;j++)if(K[j].t<=t)i=j;
  const p0=at(i-1),p1=at(i),p2=at(i+1),p3=at(i+2);
  const dt=p2.t-p1.t,u=(t-p1.t)/dt,u2=u*u,u3=u2*u;
  const h00=2*u3-3*u2+1,h10=u3-2*u2+u,h01=-2*u3+3*u2,h11=u3-u2;
  return p1.v.map((_,k)=>{const m1=(p2.v[k]-p0.v[k])/(p2.t-p0.t)*dt,m2=(p3.v[k]-p1.v[k])/(p3.t-p1.t)*dt;
    return h00*p1.v[k]+h10*m1+h01*p2.v[k]+h11*m2;});
}
const RS=.35;
function resize(){cv.width=Math.max(2,Math.round(innerWidth*RS));cv.height=Math.max(2,Math.round(innerHeight*RS));gl.viewport(0,0,cv.width,cv.height);gl.uniform2f(U.R,cv.width,cv.height);}
addEventListener('resize',resize);resize();
/* 0.15 = 떠오름(Emerge) 지점에서 시작 → 들어오자마자 빛이 차오름 */
const P0=(()=>{const v=parseFloat(new URLSearchParams(location.search).get('p'));return isNaN(v)?.15:v;})();  /* ?p= 시작 지점(0~1). 기본 .15 = 떠오름 */
let phase=P0,last=performance.now(),playing=false,raf=0;
function draw(){
  const ph=((phase%1)+1)%1,v=hermite(KEYS,ph*BASE);
  gl.uniform1f(U.PH,ph);gl.uniform1f(U.WHITE,S.white+v[0]);gl.uniform1f(U.ZOOM,v[1]);gl.uniform1f(U.WARP,S.warp*v[2]);
  gl.uniform1f(U.AMT,S.amt*v[3]);gl.uniform1f(U.DARK,Math.max(0,Math.min(1,v[4])));
  gl.drawArrays(gl.TRIANGLES,0,3);
}
function tick(now){phase+=(now-last)/1000*S.speed/S.seqlen;last=now;draw();raf=playing?requestAnimationFrame(tick):0;}
function play(){if(playing)return;playing=true;phase=P0;last=performance.now();raf=requestAnimationFrame(tick);}
function pause(){playing=false;if(raf)cancelAnimationFrame(raf);raf=0;}
addEventListener('message',e=>{if(e.data==='play')play();else if(e.data==='pause')pause();});
draw();
if(parent===window)play();
window.renderAt=p=>{phase=p;draw();};
})();
</script>
</body></html>
