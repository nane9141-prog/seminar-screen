<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04070f">
<title>사회자 대본 · 전자주주총회 플랫폼 시연 설명회</title>
<style>
@font-face{font-family:"Pretendard Variable";src:url(assets/PretendardVariable.woff2) format("woff2");font-weight:45 920;font-display:swap}
:root{--bg:#04070f;--ink:#f2f5fa;--dim:rgba(242,245,250,.42);--faint:rgba(242,245,250,.14);--blue:#0081cc;--teal:#00ada9;--amber:#ffb547;--rose:#ff4d6d;--fs:40px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;letter-spacing:-.01em;-webkit-text-size-adjust:100%}
body{display:grid;grid-template-rows:auto 1fr;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
/* 상단 */
#top{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:28px;padding:14px 24px;border-bottom:1px solid var(--faint)}
#clock{font-size:34px;font-weight:600;font-variant-numeric:tabular-nums}
#link{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--dim);margin-top:2px}
#link i{width:9px;height:9px;border-radius:50%;background:var(--rose)}
#link.ok i{background:var(--teal)}
#now{min-width:0}
#now .no{font-size:15px;color:var(--dim)}
#now .t{font-size:26px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#now .t small{font-size:18px;font-weight:500;color:var(--teal);margin-left:12px}
#seg{text-align:right;font-variant-numeric:tabular-nums}
#seg .a{font-size:15px;color:var(--dim)}
#seg .b{font-size:22px;font-weight:600}
#seg .b.late{color:var(--amber)}
#tools{display:flex;gap:6px}
#tools button{height:44px;min-width:44px;padding:0 14px;border:1px solid var(--faint);border-radius:6px;font-size:16px}
#tools button.on{background:var(--blue);border-color:var(--blue)}
/* 본문 */
#main{display:grid;grid-template-columns:1fr 360px;min-height:0}
#scroll{overflow-y:auto;padding:12vh 56px 60vh;scroll-behavior:smooth}
#side{border-left:1px solid var(--faint);overflow-y:auto;padding:24px}
h2{font-size:20px;font-weight:600;color:var(--dim);margin:150px 0 26px;padding-top:22px;border-top:1px solid var(--faint);display:flex;gap:14px;align-items:baseline}
h2 span{font-weight:500;font-variant-numeric:tabular-nums}
h2 span.mv{color:var(--amber)}
section:first-child h2{margin-top:0;border-top:0;padding-top:0}
.cue{position:relative;padding:34px 0 34px 28px;margin-bottom:36px;border-left:4px solid transparent;opacity:.32;transition:opacity .3s}
.cue.cur{opacity:1;border-left-color:var(--blue)}
.cue.nx{opacity:.6}
.cue:hover{opacity:.8}
.cue.cur:hover{opacity:1}
.mk{font-size:17px;font-weight:600;color:var(--blue);margin-bottom:12px;font-variant-numeric:tabular-nums}
.mk b{color:var(--ink);font-weight:600;margin-left:10px}
.cue:not(.cur) .mk{color:var(--dim)}
.say{font-size:var(--fs);line-height:1.6;font-weight:500;margin:0 0 .55em;text-wrap:pretty;word-break:keep-all}
.note{font-size:calc(var(--fs)*.58);line-height:1.5;color:var(--dim);margin:0 0 .8em;word-break:keep-all}
.at{font-size:calc(var(--fs)*.5);font-weight:600;color:var(--dim);margin:.6em 0 .4em}
.turn{display:flex;width:max-content;max-width:100%;align-items:center;gap:10px;font-size:calc(var(--fs)*.55);font-weight:600;color:var(--teal);margin:.2em 0 .8em}
.turn::before{content:"";width:28px;height:2px;background:var(--teal)}
.ph{color:var(--amber)}
.en{font-style:italic}
/* 질문 */
.qa{border:1px solid var(--faint);border-radius:8px;padding:22px 26px;margin:0 0 .9em}
.qa .k{font-size:16px;font-weight:600;color:var(--teal);margin-bottom:8px}
.qa .k.pre{color:var(--blue)}
.qa .x{font-size:calc(var(--fs)*.8);line-height:1.5;font-weight:500;word-break:keep-all}
.qa .m{font-size:16px;color:var(--dim);margin-top:10px}
.qa.idle .x{color:var(--dim);font-size:calc(var(--fs)*.55)}
/* 사이드 */
.sd-h{font-size:14px;font-weight:600;color:var(--dim);margin:0 0 10px}
#next{margin-bottom:34px}
#next .no{font-size:14px;color:var(--teal);font-weight:600}
#next .t{font-size:20px;font-weight:600;margin:4px 0 8px}
#next .p{font-size:16px;line-height:1.55;color:var(--dim);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
#sched{list-style:none;font-variant-numeric:tabular-nums}
#sched li{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:9px 0;border-top:1px solid var(--faint);font-size:15px;color:var(--dim)}
#sched li.on{color:var(--ink)}
#sched li.on b{color:var(--blue)}
#sched li b{font-weight:600}
#sched li em{font-style:normal;color:var(--amber)}
/* 돌발 */
#em{position:fixed;inset:0;background:rgba(4,7,15,.96);display:none;overflow-y:auto;padding:40px 56px}
#em.open{display:block}
#em h3{font-size:24px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center}
#em h3 button{height:44px;padding:0 18px;border:1px solid var(--faint);border-radius:6px;font-size:16px}
#em table{width:100%;border-collapse:collapse}
#em td{padding:18px 12px;border-top:1px solid var(--faint);vertical-align:top;font-size:18px;color:var(--dim)}
#em td:last-child{font-size:26px;line-height:1.5;color:var(--ink);font-weight:500;word-break:keep-all}
#em tr.hit td{background:rgba(0,129,204,.16)}
#em tr.hit td:first-child{box-shadow:inset 4px 0 var(--blue)}
#emflag{display:none;margin:0 0 18px;padding:14px 18px;border:1px solid var(--blue);border-radius:8px;font-size:18px}
#emflag.on{display:flex;justify-content:space-between;align-items:center;gap:16px}
#emflag button{color:var(--blue);font-weight:600}
/* 스크롤바 */
#scroll,#side,#em{scrollbar-width:thin;scrollbar-color:rgba(242,245,250,.22) transparent}
#scroll::-webkit-scrollbar,#side::-webkit-scrollbar,#em::-webkit-scrollbar{width:10px}
#scroll::-webkit-scrollbar-track,#side::-webkit-scrollbar-track,#em::-webkit-scrollbar-track{background:transparent}
#scroll::-webkit-scrollbar-thumb,#side::-webkit-scrollbar-thumb,#em::-webkit-scrollbar-thumb{background:rgba(242,245,250,.18);border-radius:10px;border:3px solid var(--bg)}
#scroll::-webkit-scrollbar-thumb:hover,#side::-webkit-scrollbar-thumb:hover,#em::-webkit-scrollbar-thumb:hover{background:var(--blue)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
@media (max-width:1100px){#main{grid-template-columns:1fr}#side{display:none}#scroll{padding:8vh 28px 60vh}#top{grid-template-columns:auto 1fr auto;gap:16px}#seg{display:none}}
@media (prefers-reduced-motion:reduce){#scroll{scroll-behavior:auto}.cue{transition:none}}
</style>
</head>
<body>
<header id="top">
 <div><div id="clock">--:--:--</div><div id="link"><i></i><span>연결 대기</span></div></div>
 <div id="now"><div class="no" id="nno">메인 스크린</div><div class="t" id="nt">메인 스크린 신호를 기다리는 중</div></div>
 <div id="seg"><div class="a" id="sa"></div><div class="b" id="sb"></div></div>
 <div id="tools">
  <button id="fm" aria-label="글자 작게">가−</button><button id="fp" aria-label="글자 크게">가+</button>
  <button id="fol" class="on" aria-pressed="true">화면 따라가기</button>
  <button id="emb">돌발 상황</button>
 </div>
</header>
<div id="main">
 <div id="scroll"><div id="emflag"><span id="emtx"></span><button id="emgo">돌발 멘트 보기</button></div><div id="doc"></div></div>
 <aside id="side">
  <div id="next"><div class="sd-h">다음 멘트</div><div class="no" id="xno"></div><div class="t" id="xt"></div><div class="p" id="xp"></div></div>
  <div class="sd-h">진행 시간</div><ul id="sched"></ul>
 </aside>
</div>
<div id="em" role="dialog" aria-label="돌발 상황 멘트"><h3>돌발 상황 멘트<button id="emx">닫기 (Esc)</button></h3><table id="emt"></table></div>

<script src="assets/sched.js"></script>
<script src="assets/supabase.min.js"></script>

let FS=+(localStorage.getItem('mc-fs')||40);const setFS=v=>{FS=Math.max(26,Math.min(72,v));document.documentElement.style.setProperty('--fs',FS+'px');localStorage.setItem('mc-fs',FS);};setFS(FS);
$('fm').onclick=()=>setFS(FS-4);$('fp').onclick=()=>setFS(FS+4);
function setFollow(v){FOLLOW=v;$('fol').classList.toggle('on',v);$('fol').setAttribute('aria-pressed',v);if(v&&CUR){const i=cueFor(CUR);if(i>=0)setCue(i,true);}}
$('fol').onclick=()=>setFollow(!FOLLOW);
cueEls.forEach((e,i)=>e.onclick=()=>{setFollow(false);setCue(i,true);});
const em=v=>$('em').classList.toggle('open',v);$('emb').onclick=()=>em(true);$('emx').onclick=()=>em(false);$('emgo').onclick=()=>em(true);
addEventListener('keydown',e=>{if(e.key==='Escape')em(false);else if(e.key==='ArrowDown'||e.key==='PageDown'){e.preventDefault();setFollow(false);setCue(Math.min(CUES.length-1,SEL+1),true);}
 else if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();setFollow(false);setCue(Math.max(0,SEL-1),true);}else if(e.key==='f'||e.key==='F')setFollow(!FOLLOW);
 else if(e.key==='+'||e.key==='=')setFS(FS+4);else if(e.key==='-')setFS(FS-4);else if(e.key==='e'||e.key==='E')em(!$('em').classList.contains('open'));});
setCue(0,false);
/* 태블릿 화면 꺼짐 방지 */
let wl=null;const wake=async()=>{try{if('wakeLock' in navigator&&document.visibilityState==='visible')wl=await navigator.wakeLock.request('screen');}catch(e){}};wake();document.addEventListener('visibilitychange',wake);
