<style>

.id h1 br.w2{display:none}

/* 11/27 18:40 LED 기본 화면 로고 삭제(빔은 유지), 글 묶음 구체 위 빈 곳 세로 가운데 */
body:not(.wide) .id .lg{display:none!important}
body:not(.wide) .id{top:246px!important}
</style></head>
<body>
<div class="stage" id="stage">
 <div class="fsw"><iframe id="fs" src="assets/four-states.html" tabindex="-1" title="" aria-hidden="true"></iframe></div>

 <div class="ph" id="ph"></div>

</div>

<script>
(()=>{
const stage=document.getElementById('stage'),$=id=>document.getElementById(id);
/* 11/27 ?a=16x9 → 빔프로젝터(16:9, 1920×1080 기준) · 기본 LED 4:3(1600×1200). ?fit=fill → 비율 무시하고 화면 꽉(장비가 늘리는 경우 대비) */
const QP=new URLSearchParams(location.search),WIDE=QP.get('a')==='16x9',W=WIDE?1920:1600,H=WIDE?1080:1200,FILL=QP.get('fit')==='fill';
if(WIDE){document.body.classList.add('wide');document.title='빔프로젝터 (16:9) — 메인 스크린 연동';}
if(QP.get('scene')==='1')document.body.classList.add('scene');
function fit(){if(FILL){stage.style.transform=`scale(${innerWidth/W},${innerHeight/H})`;return;}const s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`translate(${(innerWidth-W*s)/2}px,${(innerHeight-H*s)/2}px) scale(${s})`;}
addEventListener('resize',fit);fit();
const fsf=$('fs');fsf.addEventListener('load',()=>{try{fsf.contentWindow.postMessage('play','*');}catch(e){}});
/* 장면별 아래 칸 (메인 화면 번호 → 칸) */
const SP={
 cong1:{k:'축사',t:'김광록',w:'한국기업법학회 회장 · 충북대 법학전문대학원 교수'},
 cong2:{k:'축사',t:'정우용',w:'전 한국상장회사협의회 정책부회장 · 현 한국상장회사정책연구원 원장'},
 kism:{k:'한국주주총회연구소 출범식',t:'권재열',w:'한국주주총회연구소장 · 경희대 법학전문대학원 교수'},
 s1:{k:'Session 1',t:'전자주주총회 제도 도입 및<br>진행 관련 주요 실무 쟁점',w:'김승준<small>김앤장 법률사무소, 변호사</small>'},
 s2:{k:'Session 2',t:'상법 개정과 전자주총이 몰고 올<br>기업 경영의 지각변동',w:'권재열<small>한국주주총회연구소장</small>'},
 s3:{k:'Session 3',t:'Proxymity, 글로벌 의결권 행사<br>인프라의 혁신과 미래',w:'Scott Oakland<small>Proxymity, Head of APAC</small>'},
 s4:{k:'Session 4',t:'전자주주총회 도입 · 운영 방안 및<br>통합 솔루션 소개',w:'박성용<small>IR큐더스, 본부장</small>'},
 p1:{k:'Part 1',t:'의무화가 바꾸는 주주총회'},
 p2:{k:'Part 2',t:'전자주주총회 및<br>의결권 행사의 미래'},
 cer:{k:'Opening Remarks',t:'축사 및<br>한국주주총회연구소 출범식'},
 wait:{k:'Welcome',t:'13:00에 시작합니다',w:'안내받으신 좌석으로 입장해 주세요'},
 open:{k:'Opening',t:'개회 및 행사 안내'},
 demo:{k:'Live Demo',t:'모의 전자주주총회 시연',w:'박성용<small>IR큐더스, 본부장</small>'},
 qna:{k:'Q&amp;A',t:'사전 질문 및 현장 질의응답',w:'질문은 명찰 뒷면 QR코드로 남겨 주세요'},
 close:{k:'Thank you',t:'참석해 주셔서 감사합니다'},
 brk1:{k:'BREAK',brk:'brk1'},brk2:{k:'BREAK',brk:'brk2'},
 base:null};
function keyOf(no){no=String(no||'').toUpperCase();const m=no.match(/^M(\d+)-(S?\d+)/);if(!m)return 'base';const a=+m[1],b=m[2];
 if(a===1)return 'wait';if(a===3)return 'open';
 if(a===4)return b==='1'?'cer':b==='2'?'cong1':b==='3'?'cong2':'kism';
 if(a===5)return b==='1'?'p1':(b==='2'||b==='3')?'s1':'s2';
 if(a===6)return 'brk1';
 if(a===7)return b==='1'?'p2':(b==='6'||b==='7')?'s4':'s3';  /* 11/27 번호 정리: M7-2 통역 안내 ~ M7-5 화상 = 세션 3, M7-6 · M7-7 = 세션 4 */
 if(a===8)return 'brk2';if(a===9)return 'demo';if(a===10)return 'qna';if(a===11)return 'close';return 'base';}
const ORDER=['base','wait','open','cer','cong1','cong2','kism','p1','s1','s2','brk1','p2','s3','s4','brk2','demo','qna','close'];
let CUR='base',SCH=null,FOLLOW=true,lastRx=0,src='';
const F=m=>{m=((Math.round(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');};
function brkEnd(id){const it=(SCH||[]).find(x=>x[0]===id);if(it)return it[2];try{const x=SCHED.item(SCHED.load(),id);return x?x.end:null;}catch(e){return null;}}
function html(k){const d=SP[k];if(!d)return '';
 if(d.brk){const e=brkEnd(d.brk);return `<p class="k">BREAK</p><p class="t">잠시 쉬어가는 시간입니다</p><p class="big" id="cd">--:--</p><p class="w">${e!=null?F(e)+'에 다시 시작합니다':''}</p>`;}
 return `<p class="k">${d.k}</p><p class="t">${d.t}</p>${d.w?`<p class="w">${d.w}</p>`:''}`;}
function show(k,force){if(k===CUR&&!force)return;CUR=k;const ph=$('ph');ph.classList.remove('on');ph.classList.add('out');
 setTimeout(()=>{ph.innerHTML=html(k);ph.classList.remove('out');ph.style.display=SP[k]?'':'none';void ph.offsetWidth;ph.classList.add('on');tick();},SP[k]?330:200);}

/* ── 발표자료 미러 (11/27) ── 메인 화면 번호 · 발표 위치(pos) · PDF 장(pdk)을 받아 같은 장 · 단계를 띄움 */
const DK={cur:null,label:null,ready:false,f:$('dkf'),p:$('dkp'),b:$('dkb'),
 of(v){const no=String(v.cur||'').toUpperCase(),pos=String(v.pos||'');
  if(no==='M4-5'&&/^발표/.test(pos))return {k:'kism',src:'kism_16x9.html?embed=1',w:1920,h:1080,label:pos.replace(/^발표\s*/,'')};
  /* M5-3 세션 1 — 자료 받으면 여기 추가 */
  if(no==='M5-5')return {k:'s2',src:'session2.html?embed=1',w:1920,h:1080,label:pos};
  if(no==='M7-5')return {k:'s3',pdf:23,w:2844,h:1600,i:+(v.pdk||0)};
  if(no==='M7-7')return {k:'s4',src:'session4.html?embed=1',w:4200,h:1600,label:pos};
