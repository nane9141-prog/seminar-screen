<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>한국주주총회연구소 — 연구소장 소개 + 소개 발표 (M4-5 · session0 · 21:8)</title>
<style>
/* session0 (11/25) — M4-5 연구소장 소개 시퀀스(kism-open.html)와 M4-6 소개 발표 4장(kism.html)을 한 덱으로.
   단독 실행: session0.html (→ ← · Home · End · R 처음부터 · B 검정 · F 전체화면)
   메인 스크린에 넣을 때: session0.html?embed=1 — session4.html과 같은 방식(enter · leave · nav · edge · pos)으로 주고받음 */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
html.embed,html.embed body{background:transparent}
body.idle{cursor:none}
.stage{position:absolute;left:0;top:0;width:4200px;height:1600px;transform-origin:0 0;overflow:hidden}
html:not(.embed) .stage{background:#0a1017}
.stage iframe{position:absolute;inset:0;width:4200px;height:1600px;border:0;background:transparent;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .6s ease,visibility 0s .6s}
.stage iframe.cur{opacity:1;visibility:visible;transition:opacity .6s ease}
#black{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .4s;z-index:9}
body.black #black{opacity:1}
</style></head>
<body>
<div class="stage" id="stage">
 <iframe id="fo" src="kism-open.html?embed=1&v=11251751" tabindex="-1" title="연구소장 소개 시퀀스" aria-hidden="true"></iframe>
 <iframe id="fd" src="kism.html?embed=1&v=11251751" tabindex="-1" title="한국주주총회연구소 소개 발표" aria-hidden="true"></iframe>
</div>
<div id="black"></div>
<script>
(()=>{
const stage=document.getElementById('stage'),F=[document.getElementById('fo'),document.getElementById('fd')];
const Q=new URLSearchParams(location.search),EMB=Q.has('embed')&&parent!==window;if(EMB)document.documentElement.classList.add('embed');
const up=m=>{if(EMB)parent.postMessage(m,'*');};
function fit(){const s=Math.min(innerWidth/4200,innerHeight/1600);stage.style.transform=`translate(${(innerWidth-4200*s)/2}px,${(innerHeight-1600*s)/2}px) scale(${s})`;}
addEventListener('resize',fit);fit();
const ready=[false,false],q=[null,null];let cur=-1;
const post=(i,m)=>{if(!ready[i]){if(m.s4==='enter')q[i]=m;return;}try{F[i].contentWindow.postMessage(m,'*');}catch(e){}};
/* i: 0 = 소개 시퀀스, 1 = 발표 4장 / at: 'first' | 'last' */
function show(i,at){if(cur===i){post(i,{s4:'enter',at});return;}if(cur>=0)post(cur,{s4:'leave'});cur=i;F.forEach((f,k)=>f.classList.toggle('cur',k===i));post(i,{s4:'enter',at});if(i===0)up({s4:'pos',label:'소개'});}
function nav(d){if(cur<0)return show(0,'first');post(cur,{s4:'nav',d});}
addEventListener('message',e=>{const d=e.data||{};
 const i=F.findIndex(f=>f.contentWindow===e.source);
 if(i>=0){ if(!d.s4)return;
  if(d.s4==='ready'){ready[i]=true;if(q[i]){post(i,q[i]);q[i]=null;}if(ready[0]&&ready[1])up({s4:'ready'});}
  else if(d.s4==='edge'&&i===cur){if(i===0&&d.d>0)show(1,'first');else if(i===1&&d.d<0)show(0,'first');else up({s4:'edge',d:d.d});}
  else if(d.s4==='pos'&&i===cur){up({s4:'pos',label:i===0?'소개':('발표 '+(d.label||''))});}
  return;}
 if(!EMB||e.source!==parent||!d.s4)return;
 if(d.s4==='enter')show(d.at==='last'?1:0,d.at||'first');
 else if(d.s4==='leave'){if(cur>=0)post(cur,{s4:'leave'});}
 else if(d.s4==='nav')nav(d.d);});
addEventListener('keydown',e=>{if(EMB)return;const k=e.key;
 if(['ArrowRight',' ','PageDown','ArrowDown'].includes(k)){e.preventDefault();nav(1);}
 else if(['ArrowLeft','PageUp','ArrowUp','Backspace'].includes(k)){e.preventDefault();nav(-1);}
 else if(k==='Home'||k==='r'||k==='R'){cur=-1;show(0,'first');}
 else if(k==='End')show(1,'last');
 else if(k==='b'||k==='B'||k==='.')document.body.classList.toggle('black');
 else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});}});
let it=0;addEventListener('mousemove',()=>{document.body.classList.remove('idle');clearTimeout(it);it=setTimeout(()=>document.body.classList.add('idle'),2500);});
if(!EMB)show(0,'first');
window.S0={show,nav,get cur(){return cur}};
})();
</script>
</body></html>
